<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuietMind | Team</title>
    <meta
      name="description"
      content="Team page for QuietMind."
    >
    <link rel="stylesheet" href="style.css">
  </head>
  <body class="team-page">
    <header class="site-header">
      <div class="brand">
        <img class="brand-mark" src="assets/Icon.PNG" alt="QuietMind app icon">
        <div>
          <p class="eyebrow">Sleep meditation app</p>
          <h1>QuietMind</h1>
        </div>
      </div>
      <nav class="site-nav" aria-label="Primary">
        <a href="index.html#overview">Overview</a>
        <a href="design-process.html">Design Process</a>
        <a href="media.html">Media</a>
        <a href="team.html">Team</a>
      </nav>
    </header>

    <main>
      <section class="section team-section" id="team">
        <div class="section-heading">
          <h2>The Team</h2>
        </div>
        <table class="team-table">
          <tr>
            <td class="team-cell">
              <div class="team-card team-member">
                <img class="team-photo" src="assets/Vishal.PNG" alt="Vishal">
                <h3>Vishal</h3>
              </div>
            </td>
            <td class="team-cell">
              <div class="team-card team-member">
                <img class="team-photo" src="assets/Bharat.PNG" alt="Bharat">
                <h3>Bharat</h3>
              </div>
            </td>
            <td class="team-cell">
              <div class="team-card team-member">
                <img class="team-photo" src="assets/Gurshaan.PNG" alt="Gurshaan">
                <h3>Gurshaan</h3>
              </div>
            </td>
          </tr>
        </table>
      </section>
    </main>
